<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" role="img" aria-label="Atlas: bilim kurgu asistanı">
  <defs>
    <linearGradient id="at-kafa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D3B52"/><stop offset="1" stop-color="#0C1E2C"/>
    </linearGradient>
    <linearGradient id="at-kenar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF3EE"/><stop offset="1" stop-color="#2A8FA6"/>
    </linearGradient>
    <filter id="at-parilti" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>/* Varsayılan (durgun) görünüm; ekran durumlara göre canlandırır */ @layer varsayilan {
