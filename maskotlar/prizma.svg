<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Prizma: geometrik asistan">
  <defs>
    <radialGradient id="pz-cekirdek" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#C8FFF7"/><stop offset="1" stop-color="#5FE6D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pz-hale" cx=".5" cy=".5" r=".5">
      <stop offset=".5" stop-color="#5FE6D6" stop-opacity=".22"/><stop offset="1" stop-color="#5FE6D6" stop-opacity="0"/>
    </radialGradient>
    <filter id="pz-parilti" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>/* Varsayılan (durgun) görünüm; ekran durumlara göre canlandırır */ @layer varsayilan {
